# docker-compose para levantar RegistraduriaBack en la VM 10.43.100.131
# en el puerto 8080 como contenedor Docker.
#
# Uso:
#   docker compose -f docker/docker-compose.prod.yml up -d --build
#
# Para ver logs:
#   docker logs vote4tech-registraduria-back --follow
#
# IMPORTANTE: antes de levantar, editar las variables de entorno de este
# archivo con los valores correctos (especialmente CORS_ALLOWED_ORIGINS
# con el URL real de Cloudflare una vez obtenido).

services:
  registraduria-back:
    build:
      context: ..            # raiz del repo Vote4TechRegistraduriaBack
      dockerfile: Dockerfile
    image: vote4tech-registraduria-back:latest
    container_name: vote4tech-registraduria-back
    ports:
      - "8080:8080"
    environment:
      # Base de datos PostgreSQL (VM de BDs: 10.43.101.13)
      DB_URL: jdbc:postgresql://10.43.101.13:5432/bd_nacional_vote4tech
      DB_USER: admin_db_nacional
      DB_PASSWORD: "12345"
      # CORS: separar con coma si hay varios origenes
      # Reemplazar CLOUDFLARE_URL con el URL real obtenido del tunel
      CORS_ALLOWED_ORIGINS: "http://10.43.97.237:8090,https://bar-antenna-cape-guardian.trycloudflare.com"
    restart: unless-stopped
